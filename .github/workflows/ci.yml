name: Verify MoodMeal
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: moodmeal
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: moodmeal_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://moodmeal:ci-only-password@localhost:5432/moodmeal_test
      DIRECT_URL: postgresql://moodmeal:ci-only-password@localhost:5432/moodmeal_test
      TEST_DATABASE_URL: postgresql://moodmeal:ci-only-password@localhost:5432/moodmeal_test
      FRONTEND_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
